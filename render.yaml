services:
  - type: web
    name: depshield
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ENABLE_ATTACK_REPLAY
        value: "false"
      - key: ENABLE_SOURCE_UPLOADS
        value: "false"
      - key: ENABLE_AI_ANALYST
        value: "true"
      - key: GEMINI_MODEL
        value: "gemini-3.7-flash"
      - key: GEMINI_API_KEY
        sync: false
